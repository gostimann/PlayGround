<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>NEON STRIKER — Arcade Football</title>
<style>
:root{color-scheme:dark;--cyan:#32f4ff;--coral:#ff537c;--ink:#07101d;--muted:#89a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a14;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;color:#f2fbff;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px)}
.topbar{height:68px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{font-size:11px;letter-spacing:.24em;font-weight:900;color:#d9faff;text-shadow:0 0 16px #2cefff70;line-height:1.2}.brand b{color:var(--cyan)}
.subbrand{font-size:8px;letter-spacing:.2em;color:#6d849d;font-weight:700;margin-top:5px}
.match{display:flex;align-items:center;gap:10px;padding:8px 13px;border:1px solid #ffffff20;background:#091322bb;border-radius:12px;box-shadow:0 8px 32px #0005;backdrop-filter:blur(8px)}
.score{font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;letter-spacing:.12em}.score .home{color:var(--cyan);text-shadow:0 0 12px #32f4ff88}.score .away{color:var(--coral);text-shadow:0 0 12px #ff537c88}.colon{font-size:11px;color:#607489}.timer{font-size:12px;font-weight:800;letter-spacing:.08em;color:#e3edf6;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.status{position:absolute;top:calc(env(safe-area-inset-top) + 79px);left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;gap:6px;align-items:center;color:#8da8bd;font-size:8px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.live-dot{height:5px;width:5px;border-radius:50%;background:#61ffb7;box-shadow:0 0 10px #61ffb7;animation:pulse 1.5s infinite}
#toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(34px,10vw,62px);font-weight:1000;font-style:italic;letter-spacing:.08em;color:#fff;text-shadow:0 0 8px #fff,0 0 24px var(--cyan),0 0 50px #22c9ff;opacity:0;transition:opacity .22s,transform .35s cubic-bezier(.16,1,.3,1);white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#power{position:absolute;top:calc(env(safe-area-inset-top) + 104px);left:50%;transform:translateX(-50%);padding:6px 11px;border:1px solid #9a6cff66;border-radius:99px;background:#1a1038bb;color:#d4beff;font-size:8px;font-weight:900;letter-spacing:.14em;white-space:nowrap;opacity:0;transition:opacity .2s}#power.active{opacity:1}
.bottom-ui{position:absolute;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:104px;display:flex;align-items:flex-end;justify-content:space-between}
.hint{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);font-size:8px;letter-spacing:.14em;color:#8296aa;white-space:nowrap;font-weight:700}.hint strong{color:#d8eaf2}
.joy-label{font-size:8px;letter-spacing:.15em;font-weight:800;color:#7890a6;position:absolute;bottom:91px;left:22px}
.joystick{width:96px;height:96px;border-radius:50%;border:1px solid #a6edff30;background:radial-gradient(circle,#18324488,#0b172b66 70%);box-shadow:inset 0 0 26px #3cf3ff0b;position:relative;pointer-events:auto;touch-action:none;display:grid;place-items:center}
.joy-knob{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c7ffff,#39ddeb 48%,#157a9b);box-shadow:0 0 17px #22e8ffaa,0 3px 8px #0008;opacity:.76;transform:translate(0,0)}
.actions{display:flex;align-items:flex-end;gap:11px;pointer-events:auto}.action{position:relative;border-radius:50%;display:grid;place-items:center;touch-action:none;overflow:hidden;font-weight:900;letter-spacing:.12em;font-size:9px;color:#eaffff;border:1px solid #ffffff40;background:linear-gradient(145deg,#172b3dcc,#0b1528dd);box-shadow:0 7px 22px #0006,inset 0 0 20px #ffffff08;transition:transform .08s,filter .1s}.action:active,.action.pressed{transform:scale(.92);filter:brightness(1.35)}
#kick{width:76px;height:76px;border-color:#32f4ff88;box-shadow:0 0 22px #32f4ff23,inset 0 0 23px #32f4ff14}#dash{width:61px;height:61px;border-color:#b895ff77;color:#d6c7ff;margin-bottom:7px}.action small{font-size:7px;color:#87a2b9;letter-spacing:.16em;margin-top:-17px}.action .icon{font-size:18px;line-height:1;margin-bottom:-13px}#kick .icon{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}#dash .icon{color:#c3a6ff;text-shadow:0 0 12px #af82ff}
.cooldown{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#b894ffbb var(--cool,0%),transparent 0);opacity:.72;pointer-events:none;mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#end{position:absolute;inset:0;background:#030913d9;display:grid;place-items:center;opacity:0;visibility:hidden;transition:.3s;pointer-events:auto;backdrop-filter:blur(8px)}#end.show{opacity:1;visibility:visible}.end-card{text-align:center;border:1px solid #ffffff22;border-radius:22px;background:#091523ed;padding:32px 38px;box-shadow:0 0 70px #32f4ff15}.end-title{font-size:10px;letter-spacing:.28em;color:#8ba3b8}.end-score{font-size:48px;font-weight:1000;margin:10px 0 2px}.end-result{font-size:12px;font-weight:900;letter-spacing:.2em;color:var(--cyan)}#restart{margin-top:22px;border:1px solid #32f4ff88;background:#32f4ff16;color:#c5fbff;border-radius:99px;padding:12px 20px;font-weight:900;font-size:9px;letter-spacing:.15em}
@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
@media (min-width:700px){.topbar{padding:8px 10px}.joystick{width:112px;height:112px}.joy-knob{width:44px;height:44px}.bottom-ui{left:calc(50% - 240px);right:calc(50% - 240px)}.hint{bottom:126px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Striker football pitch"></canvas>
<div id="ui">
  <div class="topbar"><div><div class="brand">NEON <b>STRIKER</b></div><div class="subbrand">ARCADE FOOTBALL · 2V2</div></div><div class="match"><div class="score"><span class="home" id="homeScore">00</span><span class="colon"> :</span><span class="away" id="awayScore">00</span></div><div class="timer" id="timer">1:00</div></div></div>
  <div class="status"><i class="live-dot"></i><span id="statusText">KICK OFF</span></div><div id="power">✦ &nbsp; POWER ORB IN 12</div><div id="toast">GOAL!</div>
  <div class="bottom-ui"><div class="joy-label">MOVE</div><div class="joystick" id="joystick"><div class="joy-knob" id="knob"></div></div><div class="hint">MOVE <strong>·</strong> KICK <strong>·</strong> DASH</div><div class="actions"><div class="action" id="dash"><span class="icon">↯</span><small>DASH</small><div class="cooldown" id="cooldown"></div></div><div class="action" id="kick"><span class="icon">➤</span><small>KICK</small></div></div></div>
</div>
<div id="end"><div class="end-card"><div class="end-title">FULL TIME</div><div class="end-score"><span class="home" id="finalHome">00</span><span class="colon"> :</span><span class="away" id="finalAway">00</span></div><div class="end-result" id="result">VICTORY</div><button id="restart">PLAY AGAIN ↗</button></div></div>
<script>
'use strict';
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
const ui={home:document.getElementById('homeScore'),away:document.getElementById('awayScore'),timer:document.getElementById('timer'),status:document.getElementById('statusText'),toast:document.getElementById('toast'),power:document.getElementById('power'),cooldown:document.getElementById('cooldown'),end:document.getElementById('end')};
const cyan='#32f4ff',coral='#ff537c',purple='#b58aff';
let W=0,H=0,dpr=1,field={},players=[],ball=null,particles=[],trails=[],score=[0,0],timeLeft=60,phase='play',phaseTimer=0,powerTimer=12,powerOrb=null,powerEffect=null,shake=0,last=0,elapsed=0,kickQueued=false,dashQueued=false;
const input={x:0,y:0,keys:{},joyId:null,joyOrigin:null};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),hypot=Math.hypot;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);field={x:Math.max(14,W*.055),y:Math.max(104,H*.14),w:W-Math.max(28,W*.11),h:H-Math.max(176,H*.21)-Math.max(104,H*.14)};field.r=Math.min(field.w,field.h)*.105;field.goalW=Math.min(field.w*.42,92);field.goalDepth=12;initEntities();}
function initEntities(){const cx=W/2,top=field.y+field.h*.22,bot=field.y+field.h*.78;players=[makePlayer(cx,bot,cyan,0,true),makePlayer(cx-field.w*.22,bot-field.h*.13,cyan,0,false),makePlayer(cx,top,coral,1,false),makePlayer(cx+field.w*.22,top+field.h*.13,coral,1,false)];ball={x:cx,y:field.y+field.h/2,vx:rand(-18,18),vy:0,r:Math.max(7,Math.min(10,W*.023)),trail:[]};}
function makePlayer(x,y,color,team,human){return{x,y,vx:0,vy:0,r:Math.max(15,Math.min(20,W*.047)),color,team,human,faceX:0,faceY:team===0?-1:1,dash:0,dashCd:0,freeze:0,boost:0,kickFlash:0,kickCd:0,aiSeed:rand(0,10)}}
function resetPositions(){const cx=W/2,top=field.y+field.h*.22,bot=field.y+field.h*.78;players.forEach((p,i)=>{const positions=[[cx,bot],[cx-field.w*.22,bot-field.h*.13],[cx,top],[cx+field.w*.22,top+field.h*.13]][i];p.x=positions[0];p.y=positions[1];p.vx=p.vy=0;p.dash=0;p.kickFlash=0;});ball.x=cx;ball.y=field.y+field.h/2;ball.vx=rand(-15,15);ball.vy=0;ball.trail.length=0;}
function restart(){score=[0,0];timeLeft=60;phase='play';phaseTimer=0;powerTimer=12;powerOrb=null;powerEffect=null;particles=[];ui.end.classList.remove('show');ui.toast.classList.remove('show');resetPositions();updateHUD();}
window.addEventListener('resize',resize,{passive:true});resize();
function updateHUD(){ui.home.textContent=String(score[0]).padStart(2,'0');ui.away.textContent=String(score[1]).padStart(2,'0');ui.timer=`${Math.floor(timeLeft/60)}:${String(Math.ceil(timeLeft%60)).padStart(2,'0')}`;ui.status.textContent=phase==='goal'?'GOAL CELEBRATION':phase==='end'?'FULL TIME':powerEffect?powerEffect.label:'LIVE MATCH';if(powerEffect)ui.power.textContent=`✦  ${powerEffect.label} · ${Math.ceil(powerEffect.time)}s`;else if(powerOrb)ui.power.textContent='✦  POWER ORB · GRAB IT';else ui.power.textContent=`✦  POWER ORB IN ${Math.ceil(powerTimer)}`;ui.power.classList.toggle('active',!!powerOrb||!!powerEffect||powerTimer<5);}
function particleBurst(x,y,color,count=20,power=1){for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(45,300)*power;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.35,.8),max:.8,size:rand(1.5,4),color});}}
function kick(p){if(phase!=='play'||p.kickCd>0)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=hypot(dx,dy);if(d>p.r+ball.r+27)return;let nx=d?dx/d:p.faceX,ny=d?dy/d:p.faceY;if(!p.human){const goalY=p.team===0?field.y-30:field.y+field.h+30,aimX=W/2-ball.x,aimY=goalY-ball.y,l=hypot(aimX,aimY)||1;nx=aimX/l;ny=aimY/l;}if(!nx&&!ny)ny=p.team===0?-1:1;const force=powerEffect?.type==='fire'&&p.team===0?780:540;p.kickCd=.32;ball.vx+=nx*force+p.vx*.48;ball.vy+=ny*force+p.vy*.48;const speed=hypot(ball.vx,ball.vy),max=powerEffect?.type==='fire'&&p.team===0?890:640;if(speed>max){ball.vx*=max/speed;ball.vy*=max/speed;}p.kickFlash=.18;particleBurst(ball.x,ball.y,p.color,12,1.15);shake=Math.max(shake,2.4);}
function dash(p){if(phase!=='play'||p.dashCd>0)return;let x=input.x,y=input.y;if(!p.human){x=p.faceX;y=p.faceY;}if(hypot(x,y)<.2){x=p.faceX;y=p.faceY;}const l=hypot(x,y)||1;p.vx+=x/l*360;p.vy+=y/l*360;p.dash=.24;p.dashCd=2.2;if(p.human)particleBurst(p.x,p.y,p.color,9,.55);}
function goal(team){score[team]++;phase='goal';phaseTimer=2.05;ui.toast.textContent=team===0?'GOAL!':'OWNED!';ui.toast.style.setProperty('--cyan',team===0?cyan:coral);ui.toast.classList.add('show');shake=9;particleBurst(ball.x,ball.y,team===0?cyan:coral,55,1.5);updateHUD();}
function spawnPower(){powerOrb={x:W/2,y:field.y+field.h/2,r:12,phase:rand(0,6)};}
function activatePower(p){const types=[{type:'fire',label:'FIRE SHOT',time:7},{type:'speed',label:'SPEED BOOST',time:7},{type:'freeze',label:'FREEZE RIVAL',time:4}];const e=types[Math.floor(Math.random()*types.length)];powerEffect={...e,time:e.time,team:0};if(e.type==='speed')p.boost=7;if(e.type==='freeze')players.filter(q=>q.team===1).forEach(q=>q.freeze=4);particleBurst(powerOrb.x,powerOrb.y,purple,34,1);powerOrb=null;updateHUD();}
function aiMove(p,dt){if(p.freeze>0)return {x:0,y:0};const allies=players.filter(q=>q.team===p.team),opponents=players.filter(q=>q.team!==p.team);let tx=ball.x,ty=ball.y;const nearest=allies.slice().sort((a,b)=>hypot(a.x-ball.x,a.y-ball.y)-hypot(b.x-ball.x,b.y-ball.y))[0];if(p.team===0){if(p===nearest){tx=ball.x+ball.vx*.12;ty=ball.y+ball.vy*.12;}else{tx=clamp(ball.x-field.w*.25,field.x+22,field.x+field.w-22);ty=clamp(ball.y+field.h*.22,field.y+field.h*.48,field.y+field.h*.82);}}else{if(p===nearest){tx=ball.x+ball.vx*.16;ty=ball.y+ball.vy*.16;}else{tx=clamp(ball.x+field.w*.22,field.x+22,field.x+field.w-22);ty=clamp(ball.y-field.h*.2,field.y+field.h*.18,field.y+field.h*.53);}}
// Aim to approach behind the ball relative to the opponent goal.
if(p===nearest){const goalY=p.team===0?field.y-25:field.y+field.h+25;let ax=ball.x,ay=ball.y;const dx=ball.x-W/2,dy=ball.y-goalY,l=hypot(dx,dy)||1;tx=ax+dx/l*(p.r+ball.r+7);ty=ay+dy/l*(p.r+ball.r+7);}
const dx=tx-p.x,dy=ty-p.y,d=hypot(dx,dy)||1;if(d>p.r*.8&&d>75&&p.dashCd<=0&&Math.random()<dt*.55)dash(p);return{x:dx/d,y:dy/d};}
function movePlayer(p,ax,ay,dt){if(p.freeze>0){p.freeze=Math.max(0,p.freeze-dt);ax=ay=0;}const boost=p.boost>0?1.32:1,speed=(p.human?210:184)*boost;const l=hypot(ax,ay);if(l>1){ax/=l;ay/=l;}if(l>.1){p.faceX=ax;p.faceY=ay;}const accel= p.dash>0?0:1000; p.vx+=ax*accel*dt;p.vy+=ay*accel*dt;const max=speed+(p.dash>0?310:0),v=hypot(p.vx,p.vy);if(v>max){p.vx*=max/v;p.vy*=max/v;}const drag=Math.pow(p.dash>0?.992:.84,dt*60);p.vx*=drag;p.vy*=drag;p.x+=p.vx*dt;p.y+=p.vy*dt;p.dash=Math.max(0,p.dash-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.kickFlash=Math.max(0,p.kickFlash-dt);p.boost=Math.max(0,p.boost-dt);p.kickCd=Math.max(0,p.kickCd-dt);p.x=clamp(p.x,field.x+p.r,field.x+field.w-p.r);p.y=clamp(p.y+0,field.y+p.r,field.y+field.h-p.r);}
function collidePlayers(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=hypot(dx,dy),min=a.r+b.r;if(d&&d<min){const nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*.72;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny;}if(a.dash>0&&a.team!==b.team){b.vx+=nx*90;b.vy+=ny*90;}}}}
function collideBall(){for(const p of players){const dx=ball.x-p.x,dy=ball.y-p.y,d=hypot(dx,dy),min=p.r+ball.r;if(d<min&&d>0){const nx=dx/d,ny=dy/d,over=min-d;ball.x+=nx*over;ball.y+=ny*over;const rel=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;if(rel<0){const impulse=-(1.62)*rel;ball.vx+=impulse*nx+p.vx*.08;ball.vy+=impulse*ny+p.vy*.08;}}}}
function updateBall(dt){ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const friction=Math.pow(.986,dt*60);ball.vx*=friction;ball.vy*=friction;const l=hypot(ball.vx,ball.vy);if(l<4)ball.vx=ball.vy=0;if(l>760){ball.vx*=760/l;ball.vy*=760/l;}ball.trail.unshift({x:ball.x,y:ball.y});if(ball.trail.length>12)ball.trail.pop();const left=field.x+ball.r,right=field.x+field.w-ball.r,top=field.y+ball.r,bottom=field.y+field.h-ball.r,goalLeft=W/2-field.goalW/2,goalRight=W/2+field.goalW/2;
if(ball.x<left){ball.x=left;ball.vx=Math.abs(ball.vx)*.82;particleBurst(ball.x,ball.y,'#6eb6c5',3,.25);}if(ball.x>right){ball.x=right;ball.vx=-Math.abs(ball.vx)*.82;particleBurst(ball.x,ball.y,'#6eb6c5',3,.25);}
if(ball.y<top){if(ball.x>goalLeft&&ball.x<goalRight){if(ball.y<field.y-field.goalDepth){goal(0);return;}}else{ball.y=top;ball.vy=Math.abs(ball.vy)*.82;}}
if(ball.y>bottom){if(ball.x>goalLeft&&ball.x<goalRight){if(ball.y>field.y+field.h+field.goalDepth){goal(1);return;}}else{ball.y=bottom;ball.vy=-Math.abs(ball.vy)*.82;}}
}
function update(dt){elapsed+=dt;if(phase==='end')return;if(phase==='goal'){phaseTimer-=dt;if(phaseTimer<=0){phase='play';ui.toast.classList.remove('show');resetPositions();updateHUD();}return;}timeLeft-=dt;if(timeLeft<=0){timeLeft=0;phase='end';ui.end.classList.add('show');document.getElementById('finalHome').textContent=String(score[0]).padStart(2,'0');document.getElementById('finalAway').textContent=String(score[1]).padStart(2,'0');document.getElementById('result').textContent=score[0]>score[1]?'VICTORY':score[0]<score[1]?'DEFEAT':'DRAW';document.getElementById('result').style.color=score[0]>=score[1]?cyan:coral;updateHUD();return;}
powerTimer-=dt;if(powerTimer<=0&&!powerOrb&&!powerEffect){spawnPower();powerTimer=12;}if(powerEffect){powerEffect.time-=dt;if(powerEffect.time<=0){powerEffect=null;players.forEach(p=>{p.boost=0;p.freeze=0;});}}if(powerOrb)powerOrb.phase+=dt*3;
const h=players[0];let ax=input.x,ay=input.y;if(input.keys.ArrowLeft||input.keys.KeyA)ax-=1;if(input.keys.ArrowRight||input.keys.KeyD)ax+=1;if(input.keys.ArrowUp||input.keys.KeyW)ay-=1;if(input.keys.ArrowDown||input.keys.KeyS)ay+=1;if(hypot(ax,ay)>1){const z=hypot(ax,ay);ax/=z;ay/=z;}movePlayer(h,ax,ay,dt);for(let i=1;i<players.length;i++){const p=players[i],dir=aiMove(p,dt);movePlayer(p,dir.x,dir.y,dt);}collidePlayers();updateBall(dt);collideBall();for(let i=1;i<players.length;i++){const p=players[i];if(hypot(p.x-ball.x,p.y-ball.y)<p.r+ball.r+7)kick(p);}
if(kickQueued){kick(h);kickQueued=false;}if(dashQueued){dash(h);dashQueued=false;}if(powerOrb){for(const p of players){if(p.team===0&&hypot(p.x-powerOrb.x,p.y-powerOrb.y)<p.r+powerOrb.r){activatePower(p);break;}}}if(powerEffect?.type==='speed'&&powerEffect.time>0)h.boost=powerEffect.time;
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.92,dt*60);p.vy*=Math.pow(.92,dt*60);}shake=Math.max(0,shake-dt*18);updateHUD();}
function pathRound(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function glowLine(color,width=1,blur=8){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.stroke();ctx.shadowBlur=0;}
function drawPitch(){const f=field,cx=W/2,cy=f.y+f.h/2;ctx.fillStyle='#060d18';ctx.fillRect(0,0,W,H);const bg=ctx.createRadialGradient(cx,cy,20,cx,cy,Math.max(W,H)*.8);bg.addColorStop(0,'#102133');bg.addColorStop(.55,'#081321');bg.addColorStop(1,'#040912');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// subtle stadium grid
ctx.save();ctx.beginPath();ctx.rect(f.x,f.y,f.w,f.h);ctx.clip();ctx.strokeStyle='#92d9ed09';ctx.lineWidth=1;for(let x=f.x;x<f.x+f.w;x+=24){ctx.beginPath();ctx.moveTo(x,f.y);ctx.lineTo(x,f.y+f.h);ctx.stroke();}for(let y=f.y;y<f.y+f.h;y+=24){ctx.beginPath();ctx.moveTo(f.x,y);ctx.lineTo(f.x+f.w,y);ctx.stroke();}
for(let i=0;i<8;i++){ctx.fillStyle=i%2?'#ffffff03':'#4bffff04';ctx.fillRect(f.x,f.y+i*f.h/8,f.w,f.h/8);}
ctx.restore();
// outer neon boundary and markings
pathRound(f.x,f.y,f.w,f.h,8);glowLine('#32f4ff99',1.5,12);ctx.strokeStyle='#a5faff66';ctx.lineWidth=1;ctx.strokeRect(f.x+10,f.y+10,f.w-20,f.h-20);
ctx.strokeStyle='#b9e8f02b';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(f.x,cy);ctx.lineTo(f.x+f.w,cy);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,f.r,0,Math.PI*2);glowLine('#6ee9f666',1,5);ctx.beginPath();ctx.arc(cx,cy,2.4,0,Math.PI*2);ctx.fillStyle='#d5feff';ctx.fill();
const boxW=f.w*.62,boxH=f.h*.115;ctx.strokeStyle='#8feefa4d';ctx.lineWidth=1;ctx.strokeRect(cx-boxW/2,f.y,boxW,boxH);ctx.strokeRect(cx-boxW/2,f.y+f.h-boxH,boxW,boxH);ctx.strokeRect(cx-f.w*.36,f.y-3, f.w*.72,6);ctx.strokeRect(cx-f.w*.36,f.y+f.h-3,f.w*.72,6);
// goal frames and mouth glow
for(const [gy,team] of [[f.y,coral],[f.y+f.h,cyan]]){const gx=cx-f.goalW/2;ctx.save();ctx.shadowColor=team;ctx.shadowBlur=18;ctx.strokeStyle=team+'cc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+(gy===f.y?-f.goalDepth:f.goalDepth));ctx.lineTo(gx+f.goalW,gy+(gy===f.y?-f.goalDepth:f.goalDepth));ctx.lineTo(gx+f.goalW,gy);ctx.stroke();ctx.restore();ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let i=1;i<6;i++){const xx=gx+i*f.goalW/6;ctx.beginPath();ctx.moveTo(xx,gy);ctx.lineTo(xx,gy+(gy===f.y?-f.goalDepth:f.goalDepth));ctx.stroke();}}
// glowing edge accents
const edge=ctx.createLinearGradient(0,f.y,0,f.y+f.h);edge.addColorStop(0,coral+'26');edge.addColorStop(.48,'#ffffff00');edge.addColorStop(1,cyan+'26');ctx.strokeStyle=edge;ctx.lineWidth=4;ctx.strokeRect(f.x+2,f.y+2,f.w-4,f.h-4);
}
function drawPower(){if(!powerOrb)return;const p=powerOrb,r=p.r+Math.sin(p.phase)*2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.phase*.25);ctx.shadowColor=purple;ctx.shadowBlur=22;ctx.strokeStyle='#d3baff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(r,0);ctx.lineTo(0,r);ctx.lineTo(-r,0);ctx.closePath();ctx.stroke();ctx.fillStyle='#a578ff30';ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#f6eaff';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore();}
function drawBall(){for(let i=ball.trail.length-1;i>=0;i--){const t=ball.trail[i],a=(1-i/ball.trail.length)*.24;ctx.globalAlpha=a;ctx.fillStyle=i<3?'#d8ffff':cyan;ctx.shadowColor=cyan;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(t.x,t.y,ball.r*(.25+(1-i/ball.trail.length)*.62),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;const g=ctx.createRadialGradient(ball.x-ball.r*.3,ball.y-ball.r*.35,1,ball.x,ball.y,ball.r*1.35);g.addColorStop(0,'#fff');g.addColorStop(.5,'#c7eef3');g.addColorStop(1,'#55727e');ctx.fillStyle=g;ctx.shadowColor='#adffff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#1b3440';ctx.lineWidth=1;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.48,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*.14,0,Math.PI*2);ctx.fillStyle='#2e5966';ctx.fill();}
function drawPlayers(){for(const p of players){ctx.save();ctx.translate(p.x,p.y);const active=p.human;ctx.shadowColor=p.color;ctx.shadowBlur=active?22:14;const g=ctx.createRadialGradient(-p.r*.35,-p.r*.42,2,0,0,p.r*1.25);g.addColorStop(0,'#ffffff');g.addColorStop(.18,p.color);g.addColorStop(1,p.team===0?'#08728a':'#921d4a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=active?'#eaffff':'#ffffff9a';ctx.lineWidth=active?2:1.2;ctx.stroke();
// direction mark and player label
ctx.rotate(Math.atan2(p.faceY,p.faceX));ctx.fillStyle='#07111d';ctx.beginPath();ctx.moveTo(p.r*.68,0);ctx.lineTo(p.r*.1,-p.r*.28);ctx.lineTo(p.r*.1,p.r*.28);ctx.closePath();ctx.fill();ctx.rotate(-Math.atan2(p.faceY,p.faceX));if(active){ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,p.r+5,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#d8fcff';ctx.font='800 7px system-ui';ctx.textAlign='center';ctx.fillText('YOU',0,p.r+15);}if(p.dash>0){ctx.strokeStyle=p.color;ctx.globalAlpha=.6;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,p.r+6,0,Math.PI*2);ctx.stroke();}if(p.freeze>0){ctx.strokeStyle='#a8f4ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,p.r+4,0,Math.PI*2);ctx.stroke();}ctx.restore();}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;ctx.shadowBlur=0;}
function render(){ctx.save();if(shake>0)ctx.translate(rand(-shake,shake),rand(-shake,shake));drawPitch();drawPower();drawParticles();drawBall();drawPlayers();ctx.restore();}
const joy=document.getElementById('joystick'),knob=document.getElementById('knob'),kickBtn=document.getElementById('kick'),dashBtn=document.getElementById('dash');let dynamicJoy=false;
function joyStart(e){e.preventDefault();dynamicJoy=false;input.joyId=e.pointerId;const rect=joy.getBoundingClientRect();input.joyOrigin={x:rect.left+rect.width/2,y:rect.top+rect.height/2};joy.setPointerCapture(e.pointerId);joyMove(e);}
function joyMove(e){if(input.joyId!==e.pointerId||!input.joyOrigin)return;const dx=e.clientX-input.joyOrigin.x,dy=e.clientY-input.joyOrigin.y,max=33,l=hypot(dx,dy),scale=l>max?max/l:1;knob.style.transform=`translate(${dx*scale}px,${dy*scale}px)`;input.x=clamp(dx/max,-1,1);input.y=clamp(dy/max,-1,1);}
function joyEnd(e){if(input.joyId!==e.pointerId)return;input.joyId=null;input.joyOrigin=null;input.x=0;input.y=0;knob.style.transform='translate(0,0)';if(dynamicJoy){joy.style.position='relative';joy.style.left='';joy.style.top='';joy.style.bottom='';joy.style.zIndex='';dynamicJoy=false;}}
joy.addEventListener('pointerdown',joyStart);window.addEventListener('pointermove',joyMove);window.addEventListener('pointerup',joyEnd);window.addEventListener('pointercancel',joyEnd);
// Allow a thumb to begin movement anywhere in the left half, then bring the joystick to it.
canvas.addEventListener('pointerdown',e=>{if(e.clientX<W*.56&&e.clientY>H*.38&&!input.joyId){dynamicJoy=true;joy.style.position='fixed';joy.style.zIndex='5';joy.style.left=`${clamp(e.clientX-48,8,W*.42)}px`;joy.style.bottom='auto';joy.style.top=`${clamp(e.clientY-48,H*.45,H-112)}px`;const r=joy.getBoundingClientRect();input.joyId=e.pointerId;input.joyOrigin={x:r.left+r.width/2,y:r.top+r.height/2};canvas.setPointerCapture(e.pointerId);joyMove(e);}});
function buttonPress(btn,fn){btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.classList.add('pressed');fn();});for(const name of ['pointerup','pointercancel','pointerleave'])btn.addEventListener(name,()=>btn.classList.remove('pressed'));}
buttonPress(kickBtn,()=>{kickQueued=true;});buttonPress(dashBtn,()=>{dashQueued=true;});
window.addEventListener('keydown',e=>{input.keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','ShiftLeft','ShiftRight'].includes(e.code))e.preventDefault();if(e.code==='Space')kickQueued=true;if(e.code==='ShiftLeft'||e.code==='ShiftRight')dashQueued=true;});window.addEventListener('keyup',e=>{input.keys[e.code]=false;});
document.getElementById('restart').addEventListener('click',restart);
function frame(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);render();ui.cooldown.style.setProperty('--cool',`${players[0]?players[0].dashCd/2.2*100:0}%`);requestAnimationFrame(frame);}
updateHUD();requestAnimationFrame(frame);
})();
</script>
